<div id="connect-error" class="connection-error" hidden><h1>连接需要更新</h1><p id="connect-message">请从菜单栏重新打开设置。</p><button id="reload" class="button primary">重新连接</button></div>
<div class="app-shell" id="app"><aside class="sidebar"><div class="brand"><svg><use href="#i-wave"/></svg><strong>Codex Voice</strong></div><nav aria-label="主导航">
<button class="nav-item active" data-page="voice"><span class="nav-medallion"><svg><use href="#i-wave"/></svg></span>语音设置</button>
<button class="nav-item" data-page="rules"><span class="nav-medallion"><svg><use href="#i-sliders"/></svg></span>提醒规则</button>
<button class="nav-item" data-page="history"><span class="nav-medallion"><svg><use href="#i-clock"/></svg></span>播报记录<span id="history-count" class="nav-count">0</span></button>
</nav><div class="sidebar-bottom"><span class="status-dot" id="side-dot"></span><span id="side-status">连接中</span></div></aside>
<main><header class="topbar"><h1 id="breadcrumb">语音设置</h1><div class="top-actions"><button class="button small test-button"><svg><use href="#i-play"/></svg>试听</button><button id="toggle" class="button small"><svg><use href="#i-pause"/></svg><span>暂停提醒</span></button></div></header>
<section id="page-voice" class="page"><article class="card form-card"><div class="form-grid voice-fields">
<label class="field"><span>称呼</span><input data-field="call_name" maxlength="30" placeholder="播报时怎么称呼你"></label>
<label class="field"><span>音色</span><select id="speaker-select"><option value="zh_female_xiaohe_uranus_bigtts">小何 · 女声</option><option value="zh_female_vv_uranus_bigtts">Vivi · 女声</option><option value="custom">自定义音色</option></select></label>
<label class="field" id="custom-speaker" hidden><span>音色 ID</span><input data-field="speaker" placeholder="火山引擎音色 ID" spellcheck="false"></label>
<div class="field volume-field"><div class="field-row"><label for="volume">音量</label><strong id="volume-value">70%</strong></div><input id="volume" data-field="volume" type="range" min="0" max="1" step="0.05"></div>
</div></article>
<details class="card connection-settings"><summary>连接设置<span>模型 · 凭据 · 语音资源</span></summary><div class="details-content"><div class="form-grid">
<label class="field"><span>文案生成</span><select data-field="text_provider"><option value="codex">本机 Codex · ChatGPT 订阅</option><option value="deepseek">DeepSeek Harness</option></select></label>
<label class="field" id="codex-model-field"><span>Codex 模型</span><input data-field="codex_model" placeholder="跟随本机 Codex 配置" spellcheck="false"></label>
<label class="field" id="ds-provider-field" hidden><span>DeepSeek 接入</span><select data-field="deepseek_provider"><option value="deepseek-account">Harness 账号</option><option value="deepseek-official">DeepSeek API Key</option></select></label>
<label class="field" id="ds-model-field" hidden><span>DeepSeek 模型</span><input data-field="deepseek_model" spellcheck="false"></label>
<label class="field"><span>语音资源 ID</span><input data-field="tts_resource_id" spellcheck="false"></label></div>
<div class="credential-field" id="ds-key-field" hidden><label for="ds-key">DeepSeek API Key <span id="ds-key-status" class="credential-state"></span></label><div class="credential-input"><input id="ds-key" type="password" autocomplete="new-password" placeholder="留空保留现有凭据"><button class="button small" data-credential="deepseek_api_key">保存凭据</button></div></div>
<div class="credential-field"><label for="volc-key">火山 TTS API Key <span id="volc-key-status" class="credential-state"></span></label><div class="credential-input"><input id="volc-key" type="password" autocomplete="new-password" placeholder="留空保留现有凭据"><button class="button small" data-credential="volc_api_key">保存凭据</button></div></div>
</div></details><p class="page-note" id="preview-tip">修改后保存，即可用于后续提醒。</p></section>
<section id="page-rules" class="page" hidden><article class="card form-card"><div class="form-grid">
<label class="field"><span>检查间隔 <em>秒</em></span><input data-field="poll_seconds" type="number" min="0.1" max="3600" step="0.1"></label>
<label class="field"><span>合并窗口 <em>秒</em></span><input data-field="merge_seconds" type="number" min="0" max="60"></label>
<label class="field"><span>补充提醒 <em>分钟</em></span><input id="reminder-minutes" type="number" min="0.1" max="1440" step="0.1"><small>仍待处理时，最多再提醒一次。</small></label></div></article>
<article class="card quiet-card"><div class="section-title"><h2>免打扰</h2><button id="add-quiet" class="button small">添加时段</button></div><div id="quiet-list"></div><p id="quiet-empty" class="muted">未设置，全天可提醒。</p></article>
<details class="card connection-settings"><summary>高级选项</summary><div class="details-content"><div class="form-grid"><label class="field"><span>完成消息保留时间 <em>分钟</em></span><input id="age-minutes" type="number" min="0.1" max="1440" step="0.1"></label></div><div class="toggle-row"><span>包含子任务提醒</span><label class="switch"><input data-field="include_subagents" type="checkbox" aria-label="包含子任务提醒"><span></span></label></div></div></details>
<p class="page-note">桌面审批弹窗暂不支持自动提醒。</p></section>
<section id="page-history" class="page" hidden><div class="history-toolbar"><span id="event-count" class="muted">0 条</span><select id="history-filter" aria-label="筛选播放状态"><option value="all">全部状态</option><option value="played">已播放</option><option value="pending">等待播放</option><option value="failed">未成功播放</option><option value="cancelled">已取消 / 过期</option></select></div><div class="card" id="history-events"></div></section>
<div class="save-bar" id="save-bar" hidden><span>有未保存的修改</span><div><button id="discard" class="button small">撤销</button><button id="save" class="button primary small"><svg><use href="#i-check"/></svg>保存</button></div></div>
</main></div><div id="toast" role="status" hidden></div></body></html>
